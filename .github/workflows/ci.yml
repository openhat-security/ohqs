name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ohqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: ohqs/go.sum
      - name: Check
        run: make check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deploy/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

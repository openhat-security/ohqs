name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ohqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: ohqs/go.sum
      - name: Check
        run: make check

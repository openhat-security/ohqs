id: general-authorized
title: Authorized engagement (catalog-grounded)
match:
  - authorized
  - roe
  - rules of engagement
  - general
  - assessment
  - security review
steps:
  - id: roe
    title: Scope and targets
    purpose: Note in-scope hosts, credentials, and RoE when you have them; otherwise use the default lab frame.
    tool_ids: []
  - id: inventory
    title: Inventory in-scope assets
    purpose: List hosts, apps, APIs, or packages. Passive and active recon as the playbook requires.
    tool_ids: [httpx, nmap]
  - id: detect
    title: Detection with catalog tools
    purpose: Secrets, SAST, misconfig templates, crawl — then escalate to weaponized verification where applicable.
    tool_ids: [gitleaks, semgrep, nuclei, katana]
  - id: access
    title: Access-control and session checks
    purpose: Exercise authz with a proxy when credentials or roles are available.
    tool_ids: [zaproxy, pwnfox, cookie-editor]
  - id: exploit-sqli
    title: SQL injection exploitation
    purpose: Confirm SQLi and extract evidence (schema, sensitive rows) for the report.
    tool_ids: [sqlmap, sqlninja]
  - id: exploit-os-command
    title: OS command injection exploitation
    purpose: Verify arbitrary command execution on suspected parameters.
    tool_ids: [commix]
  - id: exploit-xss
    title: XSS exploitation
    purpose: Confirm executable browser context on in-scope parameters.
    tool_ids: [dalfox]
  - id: exploit-metasploit
    title: Metasploit modules
    purpose: Run auxiliary/scanner and exploit modules that match confirmed exposure.
    tool_ids: [metasploit-framework]
  - id: report
    title: Report findings
    purpose: Evidence, impact, PoC, and remediation.
    tool_ids: []

id: general-authorized
title: Authorized engagement (catalog-grounded)
match:
  - authorized
  - roe
  - rules of engagement
  - general
  - assessment
  - security review
steps:
  - id: roe
    title: Confirm authorization and scope
    purpose: Written RoE, in-scope assets, contacts, and out-of-scope exclusions. Do not proceed without authorization.
    tool_ids: []
  - id: inventory
    title: Inventory in-scope assets
    purpose: List hosts, apps, APIs, or packages you are allowed to touch. Prefer passive/catalog tools first.
    tool_ids: [httpx, nmap]
  - id: detect
    title: Detection and triage with catalog tools
    purpose: Pick catalog tools that match the situation — secrets, SAST, misconfig templates, crawl — detection only, no weaponized payloads.
    tool_ids: [gitleaks, semgrep, nuclei, katana]
  - id: access
    title: Authorized access-control checks
    purpose: If credentials/roles are in scope, exercise authz with a proxy. Stay inside RoE.
    tool_ids: [zaproxy, pwnfox, cookie-editor]
  - id: report
    title: Report findings
    purpose: Evidence, impact, and fix. Detection, triage, and reporting only.
    tool_ids: []

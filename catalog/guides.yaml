  - id: nextjs-clerk
    name: Next.js + Clerk assessment checklist
    kind: guide
    summary: Manual coverage for vibe-coded Next.js apps using Clerk — middleware, webhooks, IDOR, XSS sinks.
    when_to_use: Client assessment of a Next.js SaaS with Clerk auth before a rebuild proposal.
    tags: [nextjs, clerk, auth, authz, xss, ai-slop, saas]
    vuln_classes: [A01-broken-access-control, A03-injection, A05-security-misconfiguration, A07-identification-authentication-failures]
    homepage: https://clerk.com/docs
    docs_urls:
      - https://clerk.com/docs/references/nextjs/clerk-middleware
      - https://clerk.com/docs/webhooks/overview
    how: |
      Repo: grep for CLERK_, auth(), currentUser(), clerkMiddleware, createRouteMatcher.
      Middleware: list every /app and /api path — is it inside the matcher?
      API routes: never trust body.userId or body.orgId from the client; use auth() server-side.
      Webhooks: must verify Svix headers before processing.
      Client bundle: NEXT_PUBLIC_ only — no secret key in client JS (check .next/static or source maps).
      Browser: two Clerk users — swap session cookie only between your test accounts; compare object IDs in URLs.
    look_for: |
      Missing middleware on /api/* or app routes.
      getAuth() missing on server actions and route handlers.
      Publicly readable .env or CLERK_SECRET_KEY in git history.
      IDOR — User B reads/edits User A's resource by changing id in URL or JSON body.
      dangerouslySetInnerHTML, innerHTML, markdown render without DOMPurify.
      Webhook route with no signature check.
      Wildcard CORS on API routes returning PII.
    interpret: Each confirmed issue needs evidence in evidence/ and a fix the client can implement in a rebuild. Severity drives the takedown/rebuild recommendation — not availability attacks.
